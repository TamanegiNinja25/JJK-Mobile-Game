name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish the APK to, e.g. v1.1.0 (created from this branch if new; leave empty to only build)'
        required: false
        default: ''
      release_name:
        description: 'Release title (optional; an existing release keeps its title)'
        required: false
        default: ''
      release_notes:
        description: 'Release notes in Markdown (optional; an existing release keeps its notes)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check and bundle the game
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load the signing key
        # The permanent key lives in repository secrets so every APK installs as an update.
        env:
          KEYSTORE_B64: ${{ secrets.CC_KEYSTORE_B64 }}
          RELEASING: ${{ github.event_name == 'release' || inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cursedchronicles.keystore"
            echo "CC_KEYSTORE=$RUNNER_TEMP/cursedchronicles.keystore" >> "$GITHUB_ENV"
          elif [ "$RELEASING" = "true" ]; then
            echo "::error::Add the CC_KEYSTORE_B64 and CC_KEYSTORE_PASSWORD repository secrets before publishing a release, or the APK will not install as an update."
            exit 1
          else
            echo "::warning::CC_KEYSTORE_B64 is not set: this APK is signed with a throwaway key and will not install as an update."
          fi

      - name: Build APK
        working-directory: android
        env:
          CC_KEYSTORE_PASSWORD: ${{ secrets.CC_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CursedChronicles-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/CursedChronicles.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CursedChronicles-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    # Attaches the APK to a release: one published on GitHub, one named when
    # running the workflow by hand (created if it doesn't exist yet), or a new
    # one created by pushing a v* tag.
    if: github.event_name == 'release' || inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CursedChronicles-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease && 'true' || '' }}
          files: dist/CursedChronicles.apk
          generate_release_notes: ${{ github.event_name == 'push' }}
