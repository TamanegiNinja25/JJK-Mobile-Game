name: Delete branch (one-off)

# Deletes the old work branch, then removes this workflow file from main.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-branch.yml']

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete claude/jujutsu-kaisen-game-hc3fbp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/claude/jujutsu-kaisen-game-hc3fbp" || echo "branch already gone"
      - uses: actions/checkout@v4
      - name: Remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/delete-branch.yml
          git commit -q -m "Remove the one-off delete-branch workflow"
          git push
