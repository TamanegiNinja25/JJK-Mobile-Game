<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07060d">
  <title>Cursed Chronicles</title>
  <!-- home-screen web app (iPhone, iPad and Android browsers); the Android APK ignores these -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cursed Chronicles">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="fx-flash"></div>
    <div id="ui"></div>
  </div>
  <div id="boot">
    <div class="boot-sigil"></div>
    <div class="boot-text">Gathering cursed energy…</div>
  </div>
  <div id="rotate"><div class="rot-phone"></div><div>Turn your device sideways to play</div></div>
  <script src="game.js"></script>
</body>
</html>
